org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation crashes when the Pub cache (C:\) and this
# project (E:\) live on different drive letters — it can't compute a relative
# path between the two and throws. Full (non-incremental) compiles are
# unaffected, so disable incremental here. Negligible impact on rebuild speed.
kotlin.incremental=false
