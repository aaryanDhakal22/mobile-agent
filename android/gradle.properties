org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 1.9.0: faster builds — reuse task outputs across builds and run
# independent tasks side by side.
org.gradle.caching=true
org.gradle.parallel=true
# No configuration cache: with Flutter 3.41.4 the Flutter Gradle plugin's
# minSdk check task holds state it can't store, and the build fails even with
# configuration-cache.problems=warn. Try again with a newer Flutter.
# Incremental Kotlin compiles. Turn this off if building on Windows with the
# Pub cache and the project on different drive letters (C:\ vs E:\): Kotlin
# can't compute a relative path between them and throws.
kotlin.incremental=true
