name: Analyze + test

# Counter-tablet app CI: static analysis + the unit/widget tests on every push.
# (Release APKs are built and signed locally for now.)

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4   # match local; newer stable adds lints
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Goldens render clock times in local time and were made in the
      # store's timezone; the runner is UTC.
      - run: flutter test
        env:
          TZ: America/New_York
