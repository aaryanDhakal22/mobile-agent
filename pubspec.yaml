name: mobile_agent
description: "Quibase — the QuiccPOS counter tablet app."
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.7.0
  crypto: ^3.0.7
  # Maps (1.4.0): the Pi's offline PMTiles file drawn as vector tiles with
  # the Protomaps theme. vector_map_tiles 8 (latest stable) needs
  # flutter_map 7 + latlong2 0.9 — move them together.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: 1.5.0 # pinned: map_layers.dart reads its v4 layer lists
  vector_tile_renderer: ^5.2.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
