name: mobile_agent
description: "quiccpos counter mobile agent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/default.mp3
    - assets/sounds/ddlg.mp3
    - assets/sounds/dhoom.mp3
    - assets/sounds/indian.mp3
    - assets/sounds/nokia.mp3
